name: E2E

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - chromium-mobile
          - webkit-desktop
          - webkit-mobile
          - firefox-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Chromium backs the two desktop/mobile Chromium projects; WebKit is the
      # second real engine (Safari); Firefox is the third. All three are worth
      # the download because the app leans on OffscreenCanvas/WebGL2/
      # WebAssembly/WebCodecs feature detection, which differs by engine.
      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium webkit firefox

      # playwright.config.ts webServer already runs `npm run build` + preview.
      - name: Run E2E tests
        run: npx --no-install playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
