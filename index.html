       body font (unchanged) and Space Grotesk stays on the compression-ratio

<!-- ── Icon sprite ────────────────────────────────────────────
     The wordmark icon (rounded square + 3 chevron waves) used to be
     inlined in full three times (splash, topbar, sidebar) — same
     ~500 bytes of markup repeated per copy. Defined once here and
     referenced via <use> everywhere it's static. The splash instance
     keeps its own full inline copy below, since its waves are individually
     animated (stroke-dasharray draw-in) and <use> shadow trees can't be
     reached by external CSS selectors/animations. ─────────────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="icon-logo" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="9" fill="#3b5bdb"/>
    <path d="M8 13.5L12.5 9L17 13.5L21.5 9" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M8 18.5L12.5 14L17 18.5L21.5 14" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" fill="none"/>
    <path d="M8 23L12.5 18.5L17 23L21.5 18.5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.22" fill="none"/>
  </symbol>
</svg>

<!-- ── Splash ─────────────────────────────────────────────── -->
<!-- Animation ported from CompressF: each wave chevron draws itself in
     (stroke-dasharray/dashoffset) instead of just appearing, the icon and
     wordmark pop in on independent spring timings, and the whole splash
     fades out starting at .8s over .4s — see #splash / .sp-* in style.css. -->
<div id="splash">
  <div class="sp-inner">
    <div class="sp-logo"><svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">

    <div class="sp-name">CompressZ</div>
  </div>
</div>

<!-- ── Horizontal tab bar — replaces the old vertical sidebar.
     One scrollable row; a sliding thumb (JS-driven, see main.ts)
     tracks the active tab with the fluid easing curve. Every item
     below is a REAL link now (real href, not just data-nav) — this
     fixes the "mouse doesn't recognize it as a button" bug: an <a>
     with no href gets the browser's default (non-pointer) cursor and
     isn't keyboard-focusable, which is exactly what these looked like
     before. The router's click handler still intercepts these clicks
     and does a client-side navigation (see router.ts) — the href is
     just what makes the browser treat them as real, focusable links
     in the meantime (middle-click / "open in new tab" / cursor now
     work as expected). About and Docs are promoted into the main row
     here (ported from CompressF's flat nav, which shows them directly
     instead of behind a menu); "More" now only holds Privacy.

     Every item also carries an explicit aria-label matching its visible
     text. That's not just belt-and-suspenders: below 768px the .tab-item
     text span is hidden entirely (icon-only nav, see the media query in
     style.css) and Home's icon is a bare inline <svg> with no text
     fallback at all — a screen reader on a narrow viewport was landing
     on that tab with no accessible name whatsoever (Lighthouse's
     link-name audit; same story for the logo and the "More" button,
     whose text also disappears at that width). aria-label doesn't get
     hidden by display:none on a *different* element, so this holds at
     every width instead of only above the breakpoint. ──────── -->

<!-- ABOUT -->
<template id="tpl-about">
<div class="content-page">
  <div class="header-top" style="margin-bottom:.4rem"><span class="badge img">ℹ️</span><h1>About CompressZ</h1></div>
  <p class="page-sub">100% client-side file compression and OCR. No servers. No uploads. No tracking.</p>

  <h2>How it works</h2>
  <p>CompressZ runs entirely in your browser using WebAssembly, the Canvas API, WebCodecs, and two neural OCR engines. Every byte of your files stays on your device throughout the entire process.</p>

  <h2>CompressZ &amp; CompressF</h2>
  <p>CompressZ is a fork of <a href="https://github.com/ADJ189/CompressF" target="_blank" rel="noopener" style="color:var(--accent)">CompressF</a>, ADJ's earlier browser-native compression tool. CompressF is still maintained on its own — a leaner, format-focused sister site — while CompressZ has grown into the broader multi-engine workspace you're using now (Convert, OCR, GPU acceleration, device-aware Performance Mode, and the local AI engine below).</p>

  <h2>Technology stack</h2>
  <div class="tech-grid">
    <div class="tech-card"><h3>🦀 FFmpeg.wasm</h3><p>Compiled C FFmpeg to WebAssembly. Handles video, audio, and GIF compression with full codec support. Multithreaded via SharedArrayBuffer.</p></div>
    <div class="tech-card"><h3>🖼️ Canvas API</h3><p>OffscreenCanvas + ImageBitmap for hardware-accelerated image decoding and encoding. WebP and AVIF encoded by the browser's own GPU codec.</p></div>
    <div class="tech-card"><h3>📄 PDF.js + pdf-lib</h3><p>PDF.js 4.4 renders pages to canvas. pdf-lib 1.17 repackages images structurally. Two-strategy compression for optimal results.</p></div>
    <div class="tech-card"><h3>🎬 WebCodecs</h3><p>W3C API for hardware-accelerated video encode/decode. GPU tier-2 fallback when FFmpeg.wasm is unavailable.</p></div>
    <div class="tech-card"><h3>🔤 Tesseract.js 5</h3><p>LSTM neural OCR compiled to SIMD-accelerated WASM. 100+ languages, ~10 MB, runs offline after first load.</p></div>
    <div class="tech-card"><h3>🧠 PaddleOCR PP-OCRv3</h3><p>Baidu's three-stage pipeline via WebGL (~25 MB). Best for tables, CJK, multi-column layouts and complex scans.</p></div>
    <div class="tech-card"><h3>✨ Transformers.js</h3><p>Runs a real image-classification model locally (WASM/WebGPU) for Smart Analyze/Sort on the Images pages — Settings → AI Engine. Nothing is uploaded.</p></div>
    <div class="tech-card"><h3>🧭 Platform detection</h3><p>Feature-detects CPU cores, memory, and GPU to recommend a Performance Mode (Efficient/Balanced/Powerful) — see Settings → This Device.</p></div>
  </div>

  <h2>PDF compression strategies</h2>
  <p><strong>Strategy A (structural):</strong> Walks the PDF XObject resource dictionary, finds embedded images, decodes them, downscales to target DPI via OffscreenCanvas, re-encodes as JPEG, and splices in-place. Text, fonts, and vectors are never rasterised.</p>
  <p><strong>Strategy B (canvas render):</strong> PDF.js renders each page to OffscreenCanvas with <code>colorSpace: 'srgb'</code> and <code>intent: 'print'</code>, then pdf-lib embeds the JPEG. Used for Extreme preset and as fallback for encrypted PDFs.</p>

  <h2>Video compression tiers</h2>
  <p>Three-tier fallback: (1) FFmpeg.wasm with multithreading when SharedArrayBuffer is available, (2) WebCodecs GPU-accelerated H.264 on Chrome/Safari, (3) MediaRecorder canvas capture as universal fallback.</p>

  <h2>Credits &amp; acknowledgments</h2>
  <p>CompressZ is built on the work of several open-source projects, none of which are affiliated with or endorse CompressZ: <strong>PDF.js</strong> and <strong>pdf-lib</strong> (PDF rendering/generation), <strong>FFmpeg.wasm</strong> (video/audio/GIF), <strong>Tesseract.js</strong> and the underlying <strong>Tesseract OCR</strong> engine (100+ language OCR), <strong>PaddleOCR / PP-OCRv3</strong> via <strong>Paddle.js</strong> (primary OCR engine), <strong>mammoth.js</strong> with <strong>html2canvas</strong> (Word document conversion), <strong>🤗 Transformers.js</strong> with Xenova's ONNX model conversions (local AI engine), and <strong>anime.js</strong> (interface animation). Full attribution and license details for every dependency are in <a href="https://github.com/ADJ189/compressz/blob/main/CREDITS.md" target="_blank" rel="noopener" style="color:var(--accent)">CREDITS.md</a> on GitHub.</p>

<!-- DOCS -->
<template id="tpl-docs">
<div class="content-page">
  <div class="header-top" style="margin-bottom:.4rem"><span class="badge audio">📖</span><h1>Documentation</h1></div>
  <p class="page-sub">Technical reference for all compression options and browser compatibility.</p>

  <h2>Image options</h2>
  <ul>
    <li><code>format</code> — <code>image/webp</code> (default), <code>image/jpeg</code>, <code>image/png</code>, <code>image/avif</code></li>
    <li><code>quality</code> — 0.01–0.99. Ignored for PNG. Default: WebP 0.82, JPEG 0.85, AVIF 0.70.</li>
    <li><code>maxWidth / maxHeight</code> — Downscale preserving aspect ratio.</li>
    <li><code>targetSizeKB</code> — 14-iteration binary search to hit this file size.</li>
  </ul>

  <h2>PDF options</h2>
  <ul>
    <li><code>pdfCompressionLevel</code> — <code>low</code> (220 DPI, q=0.85), <code>recommended</code> (150 DPI, q=0.72), <code>extreme</code> (96 DPI, q=0.45 + canvas render)</li>
    <li><code>targetSizeKB</code> — Binary-searches per-image/per-page JPEG quality to approximate total target size. Accepts MB or KB in the UI.</li>
  </ul>

  <h2>Video options</h2>
  <ul>
    <li><code>videoCodec</code> — <code>h264</code>, <code>h265</code>, <code>vp9</code>, <code>vp8</code>, <code>av1</code></li>
    <li><code>quality</code> — Maps to CRF 18–35. VP9/AV1 use <code>-b:v 0</code> with equivalent CRF.</li>
    <li><code>targetSizeKB</code> — Calculates bitrate as <code>(size × 8) / duration</code>.</li>
    <li><code>fps</code> — Output framerate. 0 = preserve source.</li>
    <li><code>maxWidth</code> — Scale down (lanczos), aspect ratio preserved.</li>
    <li><code>videoPreset</code> — <code>ultrafast</code> / <code>fast</code> / <code>medium</code> / <code>slow</code></li>
  </ul>

  <h2>Audio options</h2>
  <ul>
    <li><code>audioFormat</code> — <code>mp3</code>, <code>aac</code>, <code>ogg</code>, <code>opus</code>, <code>flac</code>, <code>wav</code></li>
    <li><code>audioBitrate</code> — kbps. Defaults: mp3→192, aac→160, ogg→128, opus→96.</li>
    <li><code>audioSampleRate</code> — 0 = preserve source rate.</li>
    <li><code>stripMetadata</code> — Remove ID3/tags (<code>-map_metadata -1</code>).</li>
  </ul>

  <h2>GIF options</h2>
  <ul>
    <li><code>gifToVideo</code> — Convert to WebM VP9 instead of re-optimising as GIF.</li>
    <li><code>quality</code> — Controls palette size: 16–256 colours.</li>
    <li><code>maxWidth</code> — Lanczos resize before palette generation.</li>
    <li><code>fps</code> — Framerate decimation.</li>
  </ul>

  <h2>Merge PDF options</h2>
  <ul>
    <li>Add two or more PDFs, then reorder with the ↑/↓ controls — the merged file follows that exact order.</li>
    <li>Pages are copied with <code>PDFDocument.copyPages()</code> (pdf-lib) — content streams and resources are cloned directly, so text stays selectable and vectors stay sharp at any zoom. No page is re-rendered as an image.</li>
    <li>PDFs with owner-password restrictions (no open password) load via <code>ignoreEncryption</code>; a PDF that truly needs a password to open is reported by name and the rest of the merge still completes.</li>
  </ul>

  <h2>Images → PDF options</h2>
  <ul>
    <li>Add two or more images, reorder with ↑/↓, then combine — each image becomes one page in that order.</li>
    <li><code>pageSize</code> — <code>Auto</code> (each page matches its own image's pixel size, default), <code>A4</code>, or <code>Letter</code> (image scaled to fit and centred).</li>
    <li><code>quality</code> — JPEG quality used when embedding each image, 10–99%. Default 92%.</li>
    <li>Shares its resize/encode path with the Image compressor, including GPU-accelerated downscaling — see GPU Acceleration below.</li>
  </ul>

  <h2>GPU Acceleration &amp; Settings</h2>
  <ul>
    <li>Settings (gear icon, top-right header) opens as a dialog with a per-engine GPU toggle and default values for every engine — defaults apply the next time you open that tool, and everything is stored only in this browser's <code>localStorage</code>.</li>
    <li><strong>Images / Images → PDF:</strong> when downscaling, resize runs as a WebGL2 texture draw (hardware bilinear filtering) instead of Canvas2D's <code>drawImage()</code> scaler, with a silent fallback if WebGL2 isn't available.</li>
    <li><strong>PDF / OCR:</strong> page-rasterisation canvases use the <code>desynchronized</code> context hint, letting the browser hand the canvas straight to the compositor.</li>
    <li><strong>Video:</strong> applies only to the MediaRecorder fallback canvas (per-frame draw loop). Primary encoding is FFmpeg.wasm, which runs in WebAssembly — there's no browser API that hands a WASM module a hardware encoder, so this toggle doesn't change the primary encode path.</li>
    <li><strong>Audio / GIF:</strong> both are pure FFmpeg.wasm pipelines with no canvas step — their toggle is shown for a consistent layout but is a documented no-op.</li>
  </ul>

  <h2>PDF OCR options</h2>
  <ul>
    <li><code>engine</code> — <code>auto</code>, <code>tesseract</code>, <code>paddle</code></li>
    <li><code>language</code> — <code>auto</code>, <code>eng</code>, <code>fra</code>, <code>deu</code>, <code>spa</code>, <code>chi_sim</code>, <code>chi_tra</code>, <code>jpn</code>, <code>kor</code>, <code>ara</code>, <code>hin</code>, and more</li>
    <li><code>renderDpi</code> — 150–400 DPI. Default 250. Higher = better accuracy, slower.</li>
    <li><code>overlayMode</code> — Add invisible text over original PDF vs. new image PDF.</li>
    <li><code>extractText</code> — Also export a <code>.txt</code> file.</li>
  </ul>
  <p style="font-size:.82rem;color:var(--text-3)">The OCR page is laid out in two columns on wider screens: drop your files and watch the queue on the left, pick an engine and tune settings on the right (settings stay in view while the file list scrolls). Below ~960px width it stacks into a single column, drop zone first.</p>

  <h2>Credits</h2>
  <p>CompressZ's compression and OCR engines are built on PDF.js, pdf-lib, FFmpeg.wasm, Tesseract.js, PaddleOCR/Paddle.js, mammoth.js, html2canvas, 🤗 Transformers.js, and anime.js — see <a href="https://github.com/ADJ189/compressz/blob/main/CREDITS.md" target="_blank" rel="noopener" style="color:var(--accent)">CREDITS.md</a> for full license attribution. CompressZ is a fork of <a href="https://github.com/ADJ189/CompressF" target="_blank" rel="noopener" style="color:var(--accent)">CompressF</a>, also still maintained as a sister site.</p>

<template id="tpl-privacy">
<div class="content-page">
  <div class="header-top" style="margin-bottom:.4rem">
    <span class="badge priv">🔒</span>
    <h1>Privacy Policy</h1>
  </div>
  <p class="page-sub">Last updated: July 2026</p>

  <div class="pp-box">
    <p><strong>The short version:</strong> CompressZ processes all files locally in your browser. We do not have servers that receive your files. We collect no personal data, run no analytics, and set no cookies. Your files and their contents are never transmitted to us or any third party.</p>

  <h2>1. Who we are</h2>
  <p>CompressZ is an open-source, client-side web application for file compression and OCR. The application is served as a static website hosted on Cloudflare Pages. Source code is publicly available on GitHub.</p>

  <h2>2. Data we do NOT collect</h2>
  <ul>
    <li>We do <strong>not</strong> collect or store any files you process.</li>
    <li>We do <strong>not</strong> collect names, email addresses, or any personal identifiers.</li>
    <li>We do <strong>not</strong> use cookies for tracking or advertising.</li>
    <li>We do <strong>not</strong> run analytics scripts (no Google Analytics, Mixpanel, or similar).</li>
    <li>We do <strong>not</strong> sell, share, or transfer any data to third parties.</li>
    <li>We do <strong>not</strong> have a backend server that touches your files.</li>
  </ul>

  <h2>3. How file processing works</h2>
  <p>All compression and OCR operations run entirely inside your browser using WebAssembly, the Canvas API, and Web platform APIs. Your files are read from your device into browser memory (RAM), processed locally, and the output is written back to your device. At no point do your files traverse a network connection to our infrastructure.</p>
  <p>You can verify this yourself by opening your browser's Network tab while using CompressZ — you will see no requests containing your file data.</p>

  <h2>4. Third-party libraries loaded at runtime</h2>
  <p>Some compression engines are loaded from CDN on first use and cached by your browser thereafter. Full license attribution for each is in <a href="https://github.com/ADJ189/compressz/blob/main/CREDITS.md" target="_blank" rel="noopener" style="color:var(--accent)">CREDITS.md</a> on GitHub:</p>
  <ul>
    <li><strong>FFmpeg.wasm</strong> — loaded from <code>esm.sh</code> (video/audio/GIF). These are WebAssembly binaries only; no file data is sent to esm.sh.</li>
    <li><strong>PDF.js</strong> — loaded from <code>cdn.jsdelivr.net</code> (PDF rendering).</li>
    <li><strong>pdf-lib</strong> — loaded from <code>cdn.jsdelivr.net</code> (PDF generation).</li>
    <li><strong>Tesseract.js</strong> — loaded from <code>cdn.jsdelivr.net</code> and <code>tessdata.projectnaptha.com</code> (OCR engine and trained language data).</li>
    <li><strong>🤗 Transformers.js</strong> — bundled at build time; model weights are downloaded from Hugging Face's CDN the first time you use Settings → AI Engine, then cached by your browser. Images are classified on-device — nothing is uploaded to Hugging Face or anywhere else.</li>
    <li><strong>PaddleOCR</strong> — loaded from <code>cdn.jsdelivr.net</code> and <code>paddlejs.bj.bcebos.com</code> (OCR model weights).</li>
    <li><strong>mammoth.js</strong> and <strong>html2canvas</strong> — loaded from <code>cdn.jsdelivr.net</code> (Word document conversion).</li>
  </ul>
  <p>These CDN requests are for static assets (JavaScript and model weights) only. Your file content is never included in these requests. Standard CDN access logs (IP address, timestamp, asset requested) may be retained by the CDN providers per their own privacy policies.</p>
  <p>Google Fonts is used for typography and is loaded from <code>fonts.googleapis.com</code>. This may log your IP address per <a href="https://policies.google.com/privacy" target="_blank" rel="noopener" style="color:var(--accent)">Google's privacy policy</a>. To avoid this entirely, you can use CompressZ offline after caching.</p>

  <h2>5. Local storage</h2>
  <p>CompressZ stores two items in your browser's <code>localStorage</code>:</p>
  <ul>
    <li><code>theme</code> — your light/dark mode preference.</li>
  </ul>
  <p>These values never leave your device. No file metadata, file names, or any other information is stored in localStorage.</p>

  <h2>6. Hosting and infrastructure</h2>
  <p>CompressZ is served from <strong>Cloudflare Pages</strong>. When you access the website, Cloudflare's servers handle the HTTP request to deliver the static HTML, CSS, and JavaScript files. Cloudflare may log access requests (IP address, browser user agent, timestamp) per their <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener" style="color:var(--accent)">privacy policy</a>. These logs do not contain your file data.</p>

  <h2>7. Children's privacy</h2>
  <p>CompressZ does not knowingly collect any information from anyone, including children under 13. Because we collect no personal data whatsoever, there is nothing age-specific to disclose.</p>

  <h2>8. Changes to this policy</h2>
  <p>If we make material changes to this policy, we will update the "Last updated" date at the top. Because CompressZ collects no contact information, we cannot notify you directly — please check this page periodically if you are concerned.</p>

  <h2>9. Contact</h2>
  <p>If you have questions about this privacy policy or CompressZ's data practices, please open an issue on our <a href="https://github.com/ADJ189/compressz" target="_blank" rel="noopener" style="color:var(--accent)">GitHub repository</a>.</p>
